[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pexafy-openapi"
version = "1.3.0"
description = "The Pexafy API described in OpenAPI, plus the tool that stops the description from lying"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Marouane Tijani", email = "marouane@pexafy.com" }]
keywords = ["openapi", "api-versioning", "breaking-changes", "spec-diff", "contract-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/Pexafy/pexafy-openapi"
Issues = "https://github.com/Pexafy/pexafy-openapi/issues"

[project.scripts]
pexafy-openapi = "pexafy_openapi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pexafy_openapi"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
